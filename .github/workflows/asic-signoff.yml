name: ASIC sign-off (OpenLane RTL-to-GDS + LVS)

# Runs the physical-design + sign-off half of the predicted-vs-measured loop on a
# GitHub-hosted ubuntu runner (x86_64 Linux with Docker), which is what OpenLane's
# tool images need. This is the CI-reproducible equivalent of rtl/openlane/run.sh,
# which is meant for a Codespace / Linux box (the Apple-silicon Mac stalls under
# x86 emulation). Manual trigger only -- it pulls large tool images and takes a
# while, so we don't want it firing on every push.
on:
  workflow_dispatch:
    inputs:
      config:
        description: "OpenLane config to harden (config.json = unpipelined top; config_pipe.json = pipelined top)."
        required: false
        default: "config.json"
      clock_period_ns:
        description: "Target clock period in ns (7.0 = 143 MHz; relax to close the slow corner)."
        required: false
        default: "7.0"

permissions:
  contents: read

jobs:
  openlane-signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the OpenLane 2 orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install openlane
          openlane --version

      - name: Stage RTL into the design dir
        working-directory: rtl/openlane
        # Copy every synthesizable source (config picks which top is hardened).
        run: cp -f ../mac_int8.sv ../mac_array_8x8.sv ../mac_array_8x8_pnr.sv
               ../mac_int8_pipe.sv ../mac_array_8x8_pipe.sv ../mac_array_8x8_pipe_pnr.sv ./

      - name: Set target clock period (run-time override, committed config untouched)
        working-directory: rtl/openlane
        env:
          CLK_NS: ${{ github.event.inputs.clock_period_ns }}
          CONFIG: ${{ github.event.inputs.config }}
        run: |
          python -c "import json,os; p=os.environ.get('CONFIG') or 'config.json'; c=json.load(open(p)); clk=float(os.environ.get('CLK_NS') or c['CLOCK_PERIOD']); c['CLOCK_PERIOD']=clk; json.dump(c,open(p,'w'),indent=2); print('%s: CLOCK_PERIOD %.3f ns (%.1f MHz), top %s'%(p,clk,1000.0/clk,c['DESIGN_NAME']))"
          cat "${CONFIG:-config.json}"

      - name: Run OpenLane RTL-to-GDS + DRC + Netgen LVS
        working-directory: rtl/openlane
        env:
          CONFIG: ${{ github.event.inputs.config }}
        # --skip the antenna-property CHECK: buggy lint (StopIteration in
        # get_top_level_cell) that crashes the flow before LVS. The antenna-diode
        # INSERTION earlier in the flow is unaffected, so this is still real
        # sign-off (Magic streamout + DRC + Netgen LVS).
        #
        # `openlane --dockerized` launches the tool container with `docker run -t`,
        # which needs a TTY; GitHub-hosted runners have none, so the raw command
        # dies with "the input device is not a TTY". `script` allocates a
        # pseudo-TTY that satisfies it (the standard CI workaround); -e/-q return
        # the child's exit code so a tool failure still fails the step.
        run: |
          script -q -e -c \
            "openlane --dockerized --skip Odb.CheckDesignAntennaProperties ./${CONFIG:-config.json}" \
            /dev/null

      - name: Summarize sign-off (LVS / DRC / STA / power)
        if: always()
        working-directory: rtl/openlane
        run: |
          set +e
          RUN=$(ls -dt runs/*/ 2>/dev/null | head -1)
          echo "## ASIC sign-off summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$RUN" ]; then
            echo "No run directory produced -- the flow did not complete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Run directory: \`$RUN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Netgen LVS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find "$RUN" -iname '*lvs*' -type f 2>/dev/null | tee /tmp/lvs.list
          for f in $(cat /tmp/lvs.list); do
            grep -iE 'circuits? (match|do not match)|Netlists match|LVS' "$f" 2>/dev/null | head -20
          done | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Magic DRC" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find "$RUN" -iname '*drc*' -type f 2>/dev/null | while read -r f; do
            echo "== $f =="; grep -iE 'violation|error|COUNT|total' "$f" 2>/dev/null | head -10
          done | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Final metrics (area / timing / power)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          # Prefer the final metrics.json; otherwise fall back to the post-route STA
          # step's state_out.json (OpenLane 2 keeps cumulative metrics there).
          METRICS=$(find "$RUN" -path '*final*metrics.json' 2>/dev/null | head -1)
          [ -z "$METRICS" ] && METRICS=$(ls -1 "$RUN"*stapostpnr*/state_out.json 2>/dev/null | tail -1)
          [ -z "$METRICS" ] && METRICS=$(ls -1 "$RUN"*/state_out.json 2>/dev/null | tail -1)
          echo "metrics file: $METRICS"
          [ -n "$METRICS" ] && python -c "import json,sys; d=json.load(open(sys.argv[1])); d=d.get('metrics',d); w=['die__area','core__area','instance__area__stdcell','instance__utilization','power__total','timing__setup__ws','timing__hold__ws','route__drc_errors','route__antenna_violation__count']; out={k:d[k] for k in sorted(d) if (any(x in k for x in w) and 'corner' not in k) or 'timing__setup__ws__corner:' in k or 'timing__hold__ws__corner:' in k}; print(json.dumps(out,indent=2))" "$METRICS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload full OpenLane run (GDS, reports, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-signoff-run
          path: rtl/openlane/runs/**
          if-no-files-found: warn
